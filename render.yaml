services:

  # ─── ALPHA: Fade (Master Coordinator) ───────────────────────────────────────
  - type: web
    name: fade
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: ROLE
        value: alpha
      - key: MASTER
        value: "true"
      - key: SERVICE_NAME
        value: fade

  # ─── ALPHA: Deadlock (Secondary Coordinator) ────────────────────────────────
  - type: web
    name: deadlock
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: ROLE
        value: alpha
      - key: MASTER
        value: "false"
      - key: SERVICE_NAME
        value: deadlock

  # ─── OMEGA: Sage (jio_heavy) ────────────────────────────────────────────────
  - type: web
    name: sage
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: ROLE
        value: omega
      - key: BUCKET_GROUP
        value: jio_heavy
      - key: SERVICE_NAME
        value: sage

  # ─── OMEGA: Astra (jio_heavy replica) ───────────────────────────────────────
